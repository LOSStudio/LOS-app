name: Inspect V75 sync
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-sync.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract sync snippet
        shell: bash
        run: |
          set -euo pipefail
          unzip -q "LOS_Studio_V75_icon_fixed.zip" -d /tmp/v75
          f="$(find /tmp/v75 -name 'LOS_Studio_Acode_v75.html' -print -quit)"
          python3 - "$f" > /tmp/sync-snippet.txt <<'PY'
          import sys
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read().splitlines()
          for n in range(10068,10101):
              print(f"{n}: {s[n-1] if n<=len(s) else ''}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v75-sync-snippet
          path: /tmp/sync-snippet.txt
