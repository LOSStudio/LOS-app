name: Inspect V75 sync
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-sync.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect sync code
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v75
          mkdir /tmp/v75
          unzip -q "LOS_Studio_V75_icon_fixed.zip" -d /tmp/v75
          f="$(find /tmp/v75 -name 'LOS_Studio_Acode_v75.html' -print -quit)"
          test -n "$f"
          grep -n -E 'losCloud(Push|Pull|SyncNow|SetAutoSync)|losCloudSchedulePush|los_studio_sync' "$f" | head -n 120
          python3 - "$f" <<'PY'
          import sys
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read().splitlines()
          names=['losCloudPush','losCloudPull','losCloudSyncNow','losCloudSetAutoSync','losCloudSchedulePush']
          for n in names:
              print("\n===== "+n+" =====")
              for i,line in enumerate(s):
                  if n in line:
                      a=max(0,i-8); b=min(len(s),i+60)
                      print("\n".join(f"{j+1}: {s[j]}" for j in range(a,b)))
                      break
          PY
