name: Inspect auto sync storage listener
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-sync-order.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q LOS_Studio_V75_icon_fixed.zip -d /tmp/v75
          f="$(find /tmp/v75 -name LOS_Studio_Acode_v75.html -print -quit)"
          python3 - "$f" <<'PY'
          import sys,re
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          for p in ['losCloudSchedulePush','storage','losCloudSetAutoSync','losCloudAutoSyncV1']:
            print("\n===",p,"===")
            for m in list(re.finditer(p,s,re.I))[:20]:
              print(s[max(0,m.start()-800):m.end()+1800].replace("\n"," ")[:3000])
          PY