name: Inspect orders bridge
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-sync-order.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q LOS_Studio_V75_icon_fixed.zip -d /tmp/v75
          f="$(find /tmp/v75 -name LOS_Studio_Acode_v75.html -print -quit)"
          python3 - "$f" <<'PY'
          import sys,re
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          for n in ['initLegacyOrdersFrame','syncLegacyOrdersFrame','legacyNewOrder','LOS_ORDER']:
            print("\n===== "+n+" =====")
            for m in list(re.finditer(n,s,re.I))[:10]:
              a=max(0,m.start()-900);b=min(len(s),m.end()+3500)
              print(s[a:b].replace("\n"," ")[:4500])
          PY