name: Inspect order load calls
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-sync-order.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q LOS_Studio_V75_icon_fixed.zip -d /tmp/v75
          f="$(find /tmp/v75 -name LOS_Studio_Acode_v75.html -print -quit)"
          python3 - "$f" <<'PY'
          import sys,re,base64
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          x=base64.b64decode(re.search(r'LEGACY_ORDERS_HTML_B64\s*=\s*["\']([^"\']+)',s).group(1)).decode('utf-8','ignore')
          for m in re.finditer(r'los_orders_workspace',x,re.I):
            print(x[max(0,m.start()-700):m.end()+1000].replace("\n"," ")[:1800])
          PY