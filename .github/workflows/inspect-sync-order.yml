name: Inspect sync persistence
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-sync-order.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact sync function
        run: |
          unzip -q LOS_Studio_V75_icon_fixed.zip -d /tmp/v75
          f="$(find /tmp/v75 -name LOS_Studio_Acode_v75.html -print -quit)"
          python3 - "$f" <<'PY'
          import sys,re
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          for a,b in [('window.losCloudPull=','window.losCloudSyncNow='),('function saveState','function loadState')]:
            i=s.find(a); j=s.find(b,i+1)
            print("\n===== "+a+" =====\n"+s[i:j if j>i else i+12000])
          PY