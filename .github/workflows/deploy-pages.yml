name: Deploy LOS Studio
on:
  push:
    branches: [main]
    paths:
      - 'LOS_Studio_V75_icon_fixed.zip'
      - 'manifest.webmanifest'
      - '.github/scripts/heart-scroll.js'
      - '.github/scripts/startup-screen.html'
      - '.github/scripts/auth-resume.js'
      - 'sw.js'
      - 'confirmed.html'
      - '.github/scripts/account-settings.js'
      - '.github/scripts/app-readiness.js'
      - '.github/scripts/info-privacy.js'
      - '.github/scripts/deletion-guard.js'
      - '.github/scripts/confirmation.js'
      - 'assets/los-studio-icon.png'
      - '.github/workflows/deploy-pages.yml'
      - '.github/scripts/auth-sync.js'
      - '.github/scripts/auth-resume.js'
      - '.github/scripts/prepare-orders-sync.py'
      - '.github/scripts/prepare-mobile-layout.py'
      - '.github/scripts/brand-theme.css'
      - '.github/scripts/print-window.js'
      - '.github/scripts/download-file.js'
      - '.github/scripts/account-sync.js'
      - '.github/scripts/sync-merge.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned cloud SDK
        run: npm ci --ignore-scripts
      - name: Verify account backups and app controls
        run: npm test
      - name: Prepare clean V75 site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          unzip -q "LOS_Studio_V75_icon_fixed.zip" -d site
          shopt -s dotglob
          entries=(site/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            tmp="site_flat"
            mkdir "$tmp"
            cp -a "${entries[0]}"/. "$tmp"/
            rm -rf site
            mv "$tmp" site
          fi
          test -f site/LOS_Studio_Acode_v75.html
          cp site/LOS_Studio_Acode_v75.html site/index.html
          cp manifest.webmanifest site/manifest.webmanifest
          cp sw.js site/sw.js
          cp confirmed.html site/confirmed.html
          cp .github/scripts/confirmation.js site/confirmation.js
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js site/supabase.js
          cp assets/los-studio-icon.png site/icon-512.png
          cp assets/los-studio-icon.png site/icon-192.png
          cp assets/los-studio-icon.png site/icon.png
          cp assets/los-studio-icon.png site/apple-touch-icon.png
          echo "=== V75 initClient source ==="
          grep -n -A35 -B12 "function initClient" site/LOS_Studio_Acode_v75.html || true
          echo "=== V75 config references ==="
          grep -n -A12 -B8 "losStudioCloudConfigV1" site/LOS_Studio_Acode_v75.html | head -n 160 || true
          cmp -s site/LOS_Studio_Acode_v75.html site/index.html
          python3 .github/scripts/prepare-orders-sync.py
          python3 .github/scripts/prepare-mobile-layout.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("site/index.html")
          s=p.read_text(encoding="utf-8")
          old="function serialisableState(){return JSON.parse(JSON.stringify(state))}"
          new="function serialisableState(){const s=JSON.parse(JSON.stringify(state));try{s.localStorageData=__losCollectLocalStorage()}catch(e){s.localStorageData={}}return s}"
          if old not in s: raise SystemExit("Sync patch target not found")
          s=s.replace(old,new,1)
          marker="const oldSwitch=window.switchView; if(oldSwitch){window.switchView=function(name){oldSwitch(name);if(name==='CloudSync')loadConfig()}}"
          inject=Path(".github/scripts/sync-merge.js").read_text(encoding="utf-8")+"\n"+Path(".github/scripts/auth-sync.js").read_text(encoding="utf-8")+"\n"+Path(".github/scripts/account-sync.js").read_text(encoding="utf-8")+"\n"+Path(".github/scripts/auth-resume.js").read_text(encoding="utf-8")+"\n"+Path(".github/scripts/account-settings.js").read_text(encoding="utf-8")+"\n"+Path(".github/scripts/app-readiness.js").read_text(encoding="utf-8")+"\n"+Path(".github/scripts/info-privacy.js").read_text(encoding="utf-8")
          if marker not in s: raise SystemExit("Sync hook marker not found")
          s=s.replace(marker,inject,1)
          # Update every shortcut/favicon link, including the legacy embedded icon.
          def refresh_icon_link(match):
              tag=match.group(0)
              if not re.search(r'rel=["\x27](?:icon|shortcut icon|apple-touch-icon)["\x27]',tag,re.I): return tag
              return re.sub(r'href=["\x27][^"\x27]*["\x27]', 'href="icon-512.png?v=transparent-2"', tag)
          s=re.sub(r'<link\b[^>]*>',refresh_icon_link,s,flags=re.I)
          s=s.replace("</head>",'<style id="los-info-privacy-css">@media screen{#viewInfo:not(.los-info-unlocked)>:not(#los-info-privacy){display:none!important}}@media print{#los-info-privacy{display:none!important}}</style></head>',1)
          # Keep a normal draggable scrollbar available in desktop browsers.
          scroll_css="""<style id="los-scrollbar-fix">html{scrollbar-width:auto!important;overflow-y:scroll!important}body{scrollbar-width:auto!important;overflow-y:auto!important}::-webkit-scrollbar{width:14px!important;height:14px!important}::-webkit-scrollbar-thumb{min-height:48px!important}</style>"""
          s=s.replace("</head>",scroll_css+"<style>body.los-auth-locked>*:not(#los-auth-gate):not(#los-startup),body.los-auth-locked>*:not(#los-auth-gate):not(#los-startup) *{visibility:hidden!important}</style></head>",1)
          s=re.sub(r'(?m)^<body(?=[\s>])','<body class="los-auth-locked"',s,count=1)
          if not re.search(r'(?m)^<body class="los-auth-locked"',s): raise SystemExit("Startup authentication lock missing")
          startup=Path(".github/scripts/startup-screen.html").read_text(encoding="utf-8")
          s=re.sub(r'(?m)(^<body class="los-auth-locked"[^>]*>)',lambda m:m.group(1)+startup,s,count=1)
          heart="<script>"+Path(".github/scripts/heart-scroll.js").read_text(encoding="utf-8")+"</script>"
          end=s.rfind("</body>")
          if end<0: raise SystemExit("App body closing tag missing")
          s=s[:end]+heart+s[end:]
          p.write_text(s,encoding="utf-8")
          PY
          echo "ACCOUNT-CLOUD ARCHITECTURE: one cloud snapshot per signed-in account"
          echo "SYNC PULL APPLY FIX: refresh views without restarting authentication"
          echo "CLEAN V75 DEPLOYMENT"
          wc -c site/LOS_Studio_Acode_v75.html site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
