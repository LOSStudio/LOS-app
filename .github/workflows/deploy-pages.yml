name: Deploy LOS Studio

on:
  push:
    branches: [main]
    paths:
      - 'LOS_Studio_V75_icon_fixed.zip'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          unzip -q "LOS_Studio_V75_icon_fixed.zip" -d site

          shopt -s dotglob
          entries=(site/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            tmp="site_flat"
            mkdir "$tmp"
            cp -a "${entries[0]}"/. "$tmp"/
            rm -rf site
            mv "$tmp" site
          fi

          # The ZIP contains both the clean V75 app file and an older index.html.
          # Always use the V75 app file as the page entry point.
          if [ -f site/LOS_Studio_Acode_v75.html ]; then
            cp site/LOS_Studio_Acode_v75.html site/index.html
          elif [ ! -f site/index.html ]; then
            html_file="$(find site -maxdepth 2 -type f -iname '*.html' | head -n 1 || true)"
            if [ -n "$html_file" ]; then
              cp "$html_file" site/index.html
            else
              echo "No HTML app file found in the ZIP."
              exit 1
            fi
          fi

          rm -f site/index.html
          cp site/LOS_Studio_Acode_v75.html site/index.html
          cmp -s site/LOS_Studio_Acode_v75.html site/index.html

          cp manifest.webmanifest site/manifest.webmanifest
          cp sw.js site/sw.js


          # Patch the V75 cloud sync so the legacy Orders workspace is part of the
          # same cloud-backed state as the rest of LOS Studio. The legacy Orders
          # module keeps its full working orders/history in localStorage, so copy
          # those records into the main state before any cloud push/pull.
          python3 - <<'PY'
          from pathlib import Path
          import re, base64, json

          p = Path("site/index.html")
          s = p.read_text(encoding="utf-8", errors="ignore")

          # Main LOS Studio state: keep the full legacy Orders workspace/history.
          s = s.replace(
              "inventory:[], orders:[], orderSummaries:[], projects:[]",
              "inventory:[], orders:[], orderSummaries:[], legacyOrders:[], legacyOrderHistory:[], projects:[]",
              1
          )

          # When the parent sends the iframe its data, also send the full legacy orders.
          old_sync = """  frame.contentWindow.postMessage({
    type:'LOS_PARENT_TO_V1533',
    inventory:await buildV1533InventoryBridge(),
    packaging:buildV1533PackagingBridge(),
    packagingUsage:state.packagingUsage||[],
    info:v1533InfoBridge()
  },'*');"""
          new_sync = """  frame.contentWindow.postMessage({
    type:'LOS_PARENT_TO_V1533',
    inventory:await buildV1533InventoryBridge(),
    packaging:buildV1533PackagingBridge(),
    packagingUsage:state.packagingUsage||[],
    info:v1533InfoBridge(),
    orders:Array.isArray(state.legacyOrders)?state.legacyOrders:[],
    orderHistory:Array.isArray(state.legacyOrderHistory)?state.legacyOrderHistory:[]
  },'*');"""
          if old_sync not in s:
              raise SystemExit("FATAL: parent legacy order sync block not found")
          s = s.replace(old_sync, new_sync, 1)

          # Capture the iframe's full working order state in the parent state.
          old_msg = """  if(d.type==='LOS_V1533_ORDER_SUMMARIES'){
    const upgradingOrderIds=(state.orderSummaries||[]).some(o=>!o._historyId);
    state.orderSummaries=Array.isArray(d.summaries)?d.summaries:[];
    if(upgradingOrderIds&&historyAuditBaseline)historyAuditBaseline.orderSummaries=state.orderSummaries.map(historyClean);
    try{persistHistoryState()}catch(e){console.error(e)}
    renderLegacyOrderStrip();
    renderDashboard();
  }"""
          new_msg = """  if(d.type==='LOS_V1533_ORDER_SUMMARIES'){
    const upgradingOrderIds=(state.orderSummaries||[]).some(o=>!o._historyId);
    state.orderSummaries=Array.isArray(d.summaries)?d.summaries:[];
    if(Array.isArray(d.orders))state.legacyOrders=d.orders;
    if(Array.isArray(d.orderHistory))state.legacyOrderHistory=d.orderHistory;
    if(upgradingOrderIds&&historyAuditBaseline)historyAuditBaseline.orderSummaries=state.orderSummaries.map(historyClean);
    try{persistHistoryState()}catch(e){console.error(e)}
    renderLegacyOrderStrip();
    renderDashboard();
  }"""
          if old_msg not in s:
              raise SystemExit("FATAL: parent order summary handler not found")
          s = s.replace(old_msg, new_msg, 1)

          # Make cloud push always capture the legacy workspace directly from the
          # same-origin localStorage used by the embedded Orders module.
          old_serial = """  function serialisableState(){return JSON.parse(JSON.stringify(state))}"""
          new_serial = """  function serialisableState(){
    const out=JSON.parse(JSON.stringify(state));
    try{
      const savedOrders=localStorage.getItem('los_orders_workspace');
      const savedHistory=localStorage.getItem('los_orders_history');
      if(savedOrders)out.legacyOrders=JSON.parse(savedOrders);
      if(savedHistory)out.legacyOrderHistory=JSON.parse(savedHistory);
    }catch(e){console.warn('Legacy Orders cloud snapshot:',e)}
    return out;
  }"""
          if old_serial not in s:
              raise SystemExit("FATAL: serialisableState function not found")
          s = s.replace(old_serial, new_serial, 1)

          # Restore the full legacy workspace/history before the iframe is refreshed.
          old_pull = """      state={...state,...imported,info:{...state.info,...(imported.info||{})}};
      for(const k of ['inventory','orders','orderSummaries','projects'"""
          new_pull = """      state={...state,...imported,info:{...state.info,...(imported.info||{})}};
      if(Array.isArray(imported.legacyOrders)){
        state.legacyOrders=imported.legacyOrders;
        try{localStorage.setItem('los_orders_workspace',JSON.stringify(imported.legacyOrders))}catch(e){}
      }
      if(Array.isArray(imported.legacyOrderHistory)){
        state.legacyOrderHistory=imported.legacyOrderHistory;
        try{localStorage.setItem('los_orders_history',JSON.stringify(imported.legacyOrderHistory))}catch(e){}
      }
      for(const k of ['inventory','orders','orderSummaries','legacyOrders','legacyOrderHistory','projects'"""
          if old_pull not in s:
              raise SystemExit("FATAL: cloud pull state block not found")
          s = s.replace(old_pull, new_pull, 1)

          # Patch the embedded legacy Orders module inside its base64 payload.
          m = re.search(r"const LEGACY_ORDERS_HTML_B64\s*=\s*['\"]([^'\"]+)", s)
          if not m:
              raise SystemExit("FATAL: embedded legacy Orders base64 not found")
          legacy = base64.b64decode(m.group(1)).decode("utf-8")

          old_legacy_summary = """      parent.postMessage({type:'LOS_V1533_ORDER_SUMMARIES',summaries:buildSummaries()},'*');"""
          new_legacy_summary = """      parent.postMessage({
        type:'LOS_V1533_ORDER_SUMMARIES',
        summaries:buildSummaries(),
        orders:clone(orders),
        orderHistory:(function(){try{return clone(JSON.parse(localStorage.getItem('los_orders_history')||'[]'))}catch(e){return []}})()
      },'*');"""
          if old_legacy_summary not in legacy:
              raise SystemExit("FATAL: embedded sendSummary block not found")
          legacy = legacy.replace(old_legacy_summary, new_legacy_summary, 1)

          old_legacy_parent = """      applyParentInfo(d.info||{});
      try{
        if(typeof renderMaterials==='function')renderMaterials();"""
          new_legacy_parent = """      if(Array.isArray(d.orders)){
        orders=clone(d.orders);
        openIndex=Math.min(Math.max(openIndex,0),Math.max(0,orders.length-1));
        try{localStorage.setItem('los_orders_workspace',JSON.stringify(orders))}catch(e){}
        try{if(typeof loadForm==='function')loadForm();if(typeof renderOrders==='function')renderOrders()}catch(e){}
      }
      if(Array.isArray(d.orderHistory)){
        try{localStorage.setItem('los_orders_history',JSON.stringify(d.orderHistory))}catch(e){}
      }
      applyParentInfo(d.info||{});
      try{
        if(typeof renderMaterials==='function')renderMaterials();"""
          if old_legacy_parent not in legacy:
              raise SystemExit("FATAL: embedded parent message block not found")
          legacy = legacy.replace(old_legacy_parent, new_legacy_parent, 1)

          encoded = base64.b64encode(legacy.encode("utf-8")).decode("ascii")
          s = s[:m.start(1)] + encoded + s[m.end(1):]

          p.write_text(s, encoding="utf-8")
          print("Cloud/legacy Orders sync patch applied.")
          PY

          # Build the real PWA icons from the exact LOS Studio logo already embedded
          # in the V75 app. This keeps the installed icon identical to the app logo.
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          html = Path("site/LOS_Studio_Acode_v75.html").read_text(encoding="utf-8", errors="ignore")
          m = re.search(r'data:image/png;base64,([A-Za-z0-9+/=]+)', html)
          if not m:
              raise SystemExit("FATAL: embedded LOS Studio PNG logo not found")
          raw = base64.b64decode(m.group(1))
          Path("site/icon-512.png").write_bytes(raw)
          print(f"Extracted icon-512.png: {len(raw)} bytes")
          PY

          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi
          convert site/icon-512.png -resize 192x192 site/icon-192.png
          file site/icon-192.png site/icon-512.png

          # Force a Samsung/Chrome-compatible manifest directly into the page.
          # Samsung Internet has documented support for data: application manifests;
          # using an inline manifest avoids stale/MIME/path handling differences on Android.
          python3 - <<'PY'
          from pathlib import Path
          import re, json, urllib.parse
          p = Path("site/index.html")
          s = p.read_text(encoding="utf-8", errors="ignore")
          if "<head>" not in s:
              raise SystemExit("FATAL: <head> not found")
          s = re.sub(r'<link[^>]+rel=["\']manifest["\'][^>]*>\s*', '', s, flags=re.I)
          manifest = {
              "id": "/LOS-app/",
              "name": "LOS Studio",
              "short_name": "LOS Studio",
              "description": "LOS Studio business management app",
              "start_url": "https://losstudio.github.io/LOS-app/",
              "scope": "https://losstudio.github.io/LOS-app/",
              "display": "standalone",
              "display_override": ["standalone", "minimal-ui"],
              "background_color": "#ffffff",
              "theme_color": "#ffffff",
              "icons": [
                  {"src":"https://losstudio.github.io/LOS-app/icon-192.png","sizes":"192x192","type":"image/png","purpose":"any"},
                  {"src":"https://losstudio.github.io/LOS-app/icon-512.png","sizes":"512x512","type":"image/png","purpose":"any"},
                  {"src":"https://losstudio.github.io/LOS-app/icon-192.png","sizes":"192x192","type":"image/png","purpose":"maskable"},
                  {"src":"https://losstudio.github.io/LOS-app/icon-512.png","sizes":"512x512","type":"image/png","purpose":"maskable"}
              ]
          }
          data_url = "data:application/manifest+json," + urllib.parse.quote(json.dumps(manifest, separators=(",",":")))
          injection = f'''<link rel="manifest" href="{data_url}">
          <link rel="icon" type="image/png" sizes="192x192" href="/LOS-app/icon-192.png">
          <link rel="icon" type="image/png" sizes="512x512" href="/LOS-app/icon-512.png">
          <link rel="apple-touch-icon" sizes="192x192" href="/LOS-app/icon-192.png">
          <meta name="theme-color" content="#ffffff">
          '''
          s = s.replace("<head>", "<head>\n" + injection, 1)
          p.write_text(s, encoding="utf-8")
          PY

          # Add the service-worker registration at the very end of the document.
          # Do NOT insert it at the first </body>: the app contains </body> inside
          # a JavaScript template literal used for printing.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/index.html")
          s = p.read_text(encoding="utf-8", errors="ignore")
          registration = """
          <script>
          if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
              navigator.serviceWorker.register("./sw.js").catch(() => {});
            });
          }
          </script>
          """
          if "navigator.serviceWorker.register" not in s:
              s += "\n" + registration + "\n"
          p.write_text(s, encoding="utf-8")
          PY

          python3 - <<'PY'
          from pathlib import Path
          s = Path("site/index.html").read_text(encoding="utf-8", errors="ignore")
          bad = "</script>" + chr(10) + "</body></html>`"
          if bad in s:
              raise SystemExit("FATAL: index.html still contains the broken embedded </script> boundary")
          print("Validated index.html: no broken embedded script boundary")
          PY
          echo "Deployed files:"
          find site -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
