name: Deploy LOS Studio

on:
  push:
    branches: [main]
    paths:
      - 'LOS_Studio_V75_icon_fixed.zip'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          unzip -q "LOS_Studio_V75_icon_fixed.zip" -d site

          shopt -s dotglob
          entries=(site/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            tmp="site_flat"
            mkdir "$tmp"
            cp -a "${entries[0]}"/. "$tmp"/
            rm -rf site
            mv "$tmp" site
          fi

          # The ZIP contains both the clean V75 app file and an older index.html.
          # Always use the V75 app file as the page entry point.
          if [ -f site/LOS_Studio_Acode_v75.html ]; then
            cp site/LOS_Studio_Acode_v75.html site/index.html
          elif [ ! -f site/index.html ]; then
            html_file="$(find site -maxdepth 2 -type f -iname '*.html' | head -n 1 || true)"
            if [ -n "$html_file" ]; then
              cp "$html_file" site/index.html
            else
              echo "No HTML app file found in the ZIP."
              exit 1
            fi
          fi

          cp manifest.webmanifest site/manifest.webmanifest
          cp sw.js site/sw.js

          # Fix the literal </script> inside the inventory print template.
          # It is HTML inside a JavaScript template literal, so it must be escaped
          # before GitHub Pages serves the file.
          python3 -c 'from pathlib import Path; p=Path("site/index.html"); s=p.read_text(encoding="utf-8",errors="ignore"); s=s.replace("</script>"+chr(10)+"</body></html>`","<\\/script>"+chr(10)+"</body></html>`",1); p.write_text(s,encoding="utf-8")'

          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/index.html")
          s = p.read_text(encoding="utf-8", errors="ignore")

          if 'rel="manifest"' not in s and "rel='manifest'" not in s:
              s = s.replace(
                  "</head>",
                  '<link rel="manifest" href="./manifest.webmanifest">\n<meta name="theme-color" content="#ffffff">\n</head>',
                  1
              )

          if "navigator.serviceWorker.register" not in s:
              s = s.replace(
                  "</body>",
                  '''<script>
          if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
              navigator.serviceWorker.register("./sw.js").catch(() => {});
            });
          }
          </script>
          </body>''',
                  1
              )

          p.write_text(s, encoding="utf-8")
          PY

          echo "Deployed files:"
          find site -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
