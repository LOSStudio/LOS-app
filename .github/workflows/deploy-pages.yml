name: Deploy LOS Studio
on:
  push:
    branches: [main]
    paths:
      - 'LOS_Studio_V75_icon_fixed.zip'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare clean V75 site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          unzip -q "LOS_Studio_V75_icon_fixed.zip" -d site
          shopt -s dotglob
          entries=(site/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            tmp="site_flat"
            mkdir "$tmp"
            cp -a "${entries[0]}"/. "$tmp"/
            rm -rf site
            mv "$tmp" site
          fi
          test -f site/LOS_Studio_Acode_v75.html
          cp site/LOS_Studio_Acode_v75.html site/index.html
          cp manifest.webmanifest site/manifest.webmanifest
          cp sw.js site/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          html=Path("site/LOS_Studio_Acode_v75.html").read_text(encoding="utf-8",errors="ignore")
          m=re.search(r'data:image/png;base64,([A-Za-z0-9+/=]+)',html)
          if not m: raise SystemExit("V75 embedded logo not found")
          Path("site/icon-512.png").write_bytes(base64.b64decode(m.group(1)))
          PY
          cp site/icon-512.png site/icon-192.png
          cmp -s site/LOS_Studio_Acode_v75.html site/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path("site/index.html")
          s=p.read_text(encoding="utf-8")
          old="function serialisableState(){return JSON.parse(JSON.stringify(state))}"
          new="function serialisableState(){const s=JSON.parse(JSON.stringify(state));if(s.info&&Object.prototype.hasOwnProperty.call(s.info,'logoData'))delete s.info.logoData;try{s._syncOrdersWorkspace=JSON.parse(localStorage.getItem('los_orders_workspace')||'null');s._syncOrdersHistory=JSON.parse(localStorage.getItem('los_orders_history')||'null')}catch(e){}return s}"
          if old not in s: raise SystemExit("Sync patch target not found")
          s=s.replace(old,new,1)
          marker="const oldSwitch=window.switchView; if(oldSwitch){window.switchView=function(name){oldSwitch(name);if(name==='CloudSync')loadConfig()}}"
          inject="""const oldSwitch=window.switchView; if(oldSwitch){window.switchView=function(name){oldSwitch(name);if(name==='CloudSync')loadConfig()}}
          const __losSyncKeys=['los_business_profile','los_inventory','los_packaging','los_history','los_orders','los_orders_workspace','los_orders_history','los_db_customers','los_db_purchases','los_db_adjustments','los_hmrc_expenses_ledger'];
          let __losSyncApplying=false;
          function __losPatchSyncRealm(w){try{if(!w||w.__losSyncRealmPatched)return;const st=w.localStorage,proto=w.Storage&&w.Storage.prototype;if(!st||!proto)return;w.__losSyncRealmPatched=true;const set=proto.setItem,remove=proto.removeItem;proto.setItem=function(k,v){const r=set.call(this,k,v);if(!__losSyncApplying&&__losSyncKeys.includes(k))setTimeout(()=>{try{losCloudSchedulePush()}catch(e){}},0);return r};proto.removeItem=function(k){const r=remove.call(this,k);if(!__losSyncApplying&&__losSyncKeys.includes(k))setTimeout(()=>{try{losCloudSchedulePush()}catch(e){}},0);return r}}catch(e){}}
          __losPatchSyncRealm(window);
          document.querySelectorAll('iframe').forEach(f=>f.addEventListener('load',()=>__losPatchSyncRealm(f.contentWindow)));
          new MutationObserver(()=>document.querySelectorAll('iframe').forEach(f=>{try{if(!f.__losSyncLoadHooked){f.__losSyncLoadHooked=true;f.addEventListener('load',()=>__losPatchSyncRealm(f.contentWindow));if(f.contentDocument) __losPatchSyncRealm(f.contentWindow)}}catch(e){}})).observe(document.documentElement,{childList:true,subtree:true});
          const __losSyncPull=window.losCloudPull;
          if(__losSyncPull){window.losCloudPull=async function(){__losSyncApplying=true;try{return await __losSyncPull.apply(this,arguments)}finally{try{if(Array.isArray(state?._syncOrdersWorkspace))localStorage.setItem('los_orders_workspace',JSON.stringify(state._syncOrdersWorkspace));if(Array.isArray(state?._syncOrdersHistory))localStorage.setItem('los_orders_history',JSON.stringify(state._syncOrdersHistory))}catch(e){console.warn('Cloud Orders workspace restore skipped',e)}__losSyncApplying=false}}}
          function __losForceAutoPush(){if(__losSyncApplying)return;setTimeout(()=>{if(__losSyncApplying)return;try{if(typeof losCloudPush==='function')losCloudPush(true)}catch(e){}},1200)}
          const __losOriginalSchedule=window.losCloudSchedulePush;
          window.losCloudSchedulePush=function(){if(__losSyncApplying)return;try{if(__losOriginalSchedule)__losOriginalSchedule.apply(this,arguments)}catch(e){}};
          if(typeof window.persistHistoryState==='function'){const __losPersist=window.persistHistoryState;window.persistHistoryState=function(){const r=__losPersist.apply(this,arguments);__losForceAutoPush();return r}}
          async function __losStartRealtimeSync(){
            try{
              if(window.__losRealtimeSyncStarted)return;
              const url=localStorage.getItem('los_supabase_url')||localStorage.getItem('losCloudSupabaseUrl')||(document.getElementById('syncSupabaseUrl')||{}).value;
              const key=localStorage.getItem('los_supabase_key')||localStorage.getItem('losCloudSupabaseKey')||(document.getElementById('syncSupabaseKey')||{}).value;
              if(!url||!key)return;
              if(!window.supabase){await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';sc.onload=resolve;sc.onerror=reject;document.head.appendChild(sc)})}
              if(!window.supabase||!window.supabase.createClient)return;
              const client=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
              const {data:{session}}=await client.auth.getSession();
              if(!session?.user?.id)return;
              window.__losRealtimeSyncStarted=true;
              const channel=client.channel('los-studio-sync-'+session.user.id)
                .on('postgres_changes',{event:'UPDATE',schema:'public',table:'los_studio_sync',filter:'user_id=eq.'+session.user.id},payload=>{
                  const remote=payload.new||{};
                  const localDevice=localStorage.getItem('losStudioCloudDeviceIdV1')||'';
                  if(remote.device_id&&remote.device_id===localDevice)return;
                  __losSyncApplying=true;
                  try{if(typeof window.losCloudPull==='function')window.losCloudPull()}catch(e){}finally{setTimeout(()=>{__losSyncApplying=false},1500)}
                })
                .subscribe();
              window.__losRealtimeSyncChannel=channel;
            }catch(e){console.warn('LOS realtime sync unavailable',e)}
          }
          __losStartRealtimeSync();
          setInterval(()=>{try{__losStartRealtimeSync()}catch(e){}},10000);
          """
          if marker not in s: raise SystemExit("Sync hook marker not found")
          s=s.replace(marker,inject,1)
          p.write_text(s,encoding="utf-8")
          PY
          echo "SYNC-ONLY PATCH: cloud push on same-page local saves; restore Orders workspace after pull"
          echo "CLEAN V75 DEPLOYMENT"
          wc -c site/LOS_Studio_Acode_v75.html site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
