name: Deploy LOS Studio
on:
  push:
    branches: [main]
    paths:
      - 'LOS_Studio_V75_icon_fixed.zip'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare clean V75 site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          unzip -q "LOS_Studio_V75_icon_fixed.zip" -d site
          shopt -s dotglob
          entries=(site/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            tmp="site_flat"
            mkdir "$tmp"
            cp -a "${entries[0]}"/. "$tmp"/
            rm -rf site
            mv "$tmp" site
          fi
          test -f site/LOS_Studio_Acode_v75.html
          cp site/LOS_Studio_Acode_v75.html site/index.html
          cp manifest.webmanifest site/manifest.webmanifest
          cp sw.js site/sw.js
          python3 - <<'PY'
          from pathlib import Path
          js="(function(){\n'use strict';\nif(window.__LOS_SHADOW_SYNC_V2__)return;\nwindow.__LOS_SHADOW_SYNC_V2__=true;\nconst TABLE='app_sync';\nlet client=null,channel=null,remoteApply=false,lastRemoteAt='';\nfunction cfg(){\n let url='',key='';\n const u=document.getElementById('syncSupabaseUrl'),k=document.getElementById('syncSupabaseKey');\n if(u)url=String(u.value||'').trim(); if(k)key=String(k.value||'').trim();\n for(const n of ['los_supabase_url','losCloudSupabaseUrl','los_supabase_key','losCloudSupabaseKey']){\n  const v=String(localStorage.getItem(n)||'').trim();\n  if(!url&&/url/i.test(n))url=v; if(!key&&/key/i.test(n))key=v;\n }\n return {url:url.replace(/\\/$/,''),key};\n}\nfunction nativeWrap(){\n if(!window.AndroidSupabase||typeof window.AndroidSupabase.request!=='function'||!window.supabase?.createClient)return;\n if(window.supabase.createClient.__losNativeWrapped)return;\n const original=window.supabase.createClient;\n const nativeFetch=async function(input,init){\n  const source=input instanceof Request?input:null,url=typeof input==='string'?input:String(input?.url||'');\n  if(!/^https:\\/\\/[a-z0-9-]+\\.supabase\\.co\\//i.test(url))return fetch(input,init);\n  const o=init||{},h=new Headers(o.headers||(source?source.headers:undefined));\n  let body=o.body;if(body===undefined&&source)body=await source.clone().text();\n  const req={method:String(o.method||(source?source.method:'GET')).toUpperCase(),headers:Object.fromEntries(h.entries()),body:body==null?'':String(body)};\n  const out=JSON.parse(window.AndroidSupabase.request(url,JSON.stringify(req)));\n  if(out.error)throw new TypeError(out.error);\n  return new Response(out.body||'',{status:Number(out.status)||200,statusText:out.statusText||'',headers:out.headers||{}});\n };\n const wrapped=function(url,key,options){const o=options||{},g=o.global||{};return original(url,key,{...o,global:{...g,fetch:nativeFetch}})};\n wrapped.__losNativeWrapped=true; window.supabase.createClient=wrapped;\n}\nasync function getClient(){\n const c=cfg(); if(!c.url||!c.key)return null;\n if(!window.supabase?.createClient)await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});\n nativeWrap();\n if(!client)client=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});\n return client;\n}\nasync function mirror(){\n if(remoteApply)return;\n try{\n  const sb=await getClient();if(!sb)return;\n  const {data:{user},error:ue}=await sb.auth.getUser();if(ue||!user)return;\n  const {data:row,error}=await sb.from('los_studio_sync').select('user_id,state,device_id,app_version,updated_at').eq('user_id',user.id).maybeSingle();\n  if(error||!row)return;\n  const {data:saved,error:se}=await sb.from(TABLE).upsert({user_id:user.id,data_payload:{source:'los_studio_sync',state:row.state,device_id:row.device_id,app_version:row.app_version}},{onConflict:'user_id'}).select('updated_at').single();\n  if(!se&&saved)lastRemoteAt=saved.updated_at||'';\n }catch(e){console.warn('[LOS shadow sync] mirror failed silently',e)}\n}\nfunction wrapPush(){\n if(typeof window.losCloudPush!=='function'||window.losCloudPush.__losShadowWrapped)return;\n const original=window.losCloudPush;\n const wrapped=async function(){const result=await original.apply(this,arguments);if(!remoteApply)await mirror();return result};\n wrapped.__losShadowWrapped=true;window.losCloudPush=wrapped;\n}\nasync function applyRemote(row){\n if(!row||row.updated_at===lastRemoteAt)return;\n const d=row.data_payload||{};\n const localDevice=localStorage.getItem('losStudioCloudDeviceIdV1')||'';\n if(d.device_id&&localDevice&&d.device_id===localDevice)return;\n remoteApply=true;const oldConfirm=window.confirm;\n try{window.confirm=()=>true;if(typeof window.losCloudPull==='function')await window.losCloudPull();lastRemoteAt=row.updated_at||''}\n catch(e){console.warn('[LOS shadow sync] remote apply failed silently',e)}\n finally{window.confirm=oldConfirm;remoteApply=false}\n}\nasync function start(){\n try{\n  wrapPush();const sb=await getClient();if(!sb)return;\n  const {data:{user},error}=await sb.auth.getUser();if(error||!user)return;\n  await mirror();\n  channel=sb.channel('los-app-sync-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:TABLE,filter:'user_id=eq.'+user.id},p=>void applyRemote(p.new)).subscribe();\n }catch(e){console.warn('[LOS shadow sync] startup failed silently',e)}\n}\nconst boot=()=>setTimeout(()=>void start(),0);\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();\nwindow.LOSShadowSync={start,mirror};\n})();"
          Path("site/shadow-sync.js").write_text(js,encoding="utf-8")
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path("site/index.html")
          s=p.read_text(encoding="utf-8")
          tag='<script src="./shadow-sync.js"></script>'
          if tag not in s:
              s += "\n" + tag + "\n"
          p.write_text(s,encoding="utf-8")
          PY
          echo "V75 SOURCE UNTOUCHED; SHADOW SYNC LAYER INJECTED"
          wc -c site/LOS_Studio_Acode_v75.html site/index.html site/shadow-sync.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
