name: Deploy LOS Studio
on:
  push:
    branches: [main]
    paths:
      - 'LOS_Studio_V75_icon_fixed.zip'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare clean V75 site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          unzip -q "LOS_Studio_V75_icon_fixed.zip" -d site
          shopt -s dotglob
          entries=(site/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            tmp="site_flat"
            mkdir "$tmp"
            cp -a "${entries[0]}"/. "$tmp"/
            rm -rf site
            mv "$tmp" site
          fi
          test -f site/LOS_Studio_Acode_v75.html
          cp site/LOS_Studio_Acode_v75.html site/index.html
          cp manifest.webmanifest site/manifest.webmanifest
          cp sw.js site/sw.js
          python3 - <<'PY'
          from pathlib import Path
          js="(function(){\n'use strict';\nif(window.__LOS_SHADOW_SYNC__)return;\nwindow.__LOS_SHADOW_SYNC__=true;\nconst TABLE='app_sync';\nlet client=null,channel=null,timer=null,remoteApply=false,lastRemoteUpdatedAt='';\nfunction readConfig(){\n let url='',key='';\n for(const k of ['los_supabase_url','los_supabase_key','losCloudSupabaseUrl','losCloudSupabaseKey']){\n  const v=localStorage.getItem(k)||'';\n  if(!url&&/url/i.test(k))url=v;\n  if(!key&&/key/i.test(k))key=v;\n }\n if(!url||!key)for(const el of document.querySelectorAll('input')){\n  const v=String(el.value||'').trim();\n  if(!url&&/^https:\\/\\/[^/]+\\.supabase\\.co\\/?$/i.test(v))url=v;\n  if(!key&&/^sb_(publishable|anon)_/i.test(v))key=v;\n }\n return {url:url.trim().replace(/\\/$/,''),key:key.trim()};\n}\nfunction snapshot(){\n const data={};\n for(let i=0;i<localStorage.length;i++){\n  const k=localStorage.key(i);\n  if(!k||/supabase.*key/i.test(k))continue;\n  try{data[k]=localStorage.getItem(k)}catch(e){}\n }\n return {localStorageData:data};\n}\nfunction existingApply(){\n for(const n of ['applyCloudData','applyRemoteCloudData','applyLocalData','loadCloudData','importCloudData'])\n  if(typeof window[n]==='function')return window[n];\n return null;\n}\nasync function applyRemote(payload){\n if(!payload||typeof payload!=='object')return;\n remoteApply=true;\n try{\n  const fn=existingApply();\n  if(fn){await fn(payload);return}\n  const data=payload.localStorageData;\n  if(data&&typeof data==='object')for(const [k,v] of Object.entries(data)){\n   try{\n    const old=localStorage.getItem(k);\n    localStorage.setItem(k,String(v));\n    try{window.dispatchEvent(new StorageEvent('storage',{key:k,oldValue:old,newValue:String(v),storageArea:localStorage,url:location.href}))}catch(e){}\n   }catch(e){}\n  }\n }catch(e){console.warn('[LOS shadow sync] remote apply failed silently',e)}\n finally{remoteApply=false}\n}\nasync function push(){\n if(remoteApply||!client)return;\n try{\n  const {data:{user},error:ue}=await client.auth.getUser();\n  if(ue||!user)return;\n  const {error}=await client.from(TABLE).upsert({user_id:user.id,data_payload:snapshot()},{onConflict:'user_id'});\n  if(error)console.warn('[LOS shadow sync] push failed silently',error.message);\n }catch(e){console.warn('[LOS shadow sync] push failed silently',e)}\n}\nfunction schedulePush(){\n if(remoteApply)return;\n clearTimeout(timer);\n timer=setTimeout(()=>void push(),700);\n}\nfunction installObserver(){\n const proto=Storage.prototype;\n if(proto.__losShadowWrapped)return;\n const set=proto.setItem,remove=proto.removeItem,clear=proto.clear;\n proto.__losShadowWrapped=true;\n proto.setItem=function(k,v){const r=set.call(this,k,v);if(this===localStorage&&!remoteApply)schedulePush();return r};\n proto.removeItem=function(k){const r=remove.call(this,k);if(this===localStorage&&!remoteApply)schedulePush();return r};\n proto.clear=function(){const r=clear.call(this);if(this===localStorage&&!remoteApply)schedulePush();return r};\n}\nfunction loadSupabase(){\n return new Promise((resolve,reject)=>{\n  if(window.supabase&&typeof window.supabase.createClient==='function'){resolve();return}\n  const s=document.createElement('script');\n  s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';\n  s.onload=resolve;s.onerror=reject;document.head.appendChild(s);\n });\n}\nasync function start(){\n try{\n  const cfg=readConfig();\n  if(!cfg.url||!cfg.key)return;\n  await loadSupabase();\n  if(!window.supabase||typeof window.supabase.createClient!=='function')return;\n  client=window.supabase.createClient(cfg.url,cfg.key);\n  installObserver();\n  const {data:{user},error}=await client.auth.getUser();\n  if(error||!user)return;\n  channel=client.channel('los-shadow-sync-'+user.id)\n   .on('postgres_changes',{event:'*',schema:'public',table:TABLE,filter:'user_id=eq.'+user.id},payload=>{\n    if(payload.eventType==='DELETE')return;\n    const row=payload.new||{};\n    if(row.updated_at&&row.updated_at===lastRemoteUpdatedAt)return;\n    lastRemoteUpdatedAt=row.updated_at||'';\n    void applyRemote(row.data_payload);\n   })\n   .subscribe();\n  await push();\n }catch(e){console.warn('[LOS shadow sync] startup failed silently',e)}\n}\nwindow.LOSShadowSync={start,push,stop:async function(){try{if(channel&&client)await client.removeChannel(channel);channel=null}catch(e){}}};\nconst boot=()=>setTimeout(()=>void start(),0);\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();\n})();"
          Path("site/shadow-sync.js").write_text(js,encoding="utf-8")
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path("site/index.html")
          s=p.read_text(encoding="utf-8")
          tag='<script src="./shadow-sync.js"></script>'
          if tag not in s:
              s += "\n" + tag + "\n"
          p.write_text(s,encoding="utf-8")
          PY
          echo "V75 SOURCE UNTOUCHED; SHADOW SYNC LAYER INJECTED"
          wc -c site/LOS_Studio_Acode_v75.html site/index.html site/shadow-sync.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
