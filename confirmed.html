<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email confirmed - LOS Studio</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      background: #fffafc;
      color: #173653;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }
    main {
      width: min(100%, 460px);
      box-sizing: border-box;
      padding: 30px;
      border: 2px dashed #b9dff1;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 12px 34px rgba(23, 54, 83, .12);
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      color: #173653;
    }
    p {
      margin: 0 0 18px;
      color: #557089;
      font-size: 1.1rem;
      line-height: 1.45;
    }
    a {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 10px;
      background: #dff3fc;
      color: #173653;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Email confirmation</h1>
    <p>Open the confirmation link from your email, then return to the app and log in.</p>
    <a href="./">Open LOS Studio</a>
  </main>
  <script>
    const params = new URLSearchParams(location.hash.slice(1));
    const query = new URLSearchParams(location.search);
    const error = params.get('error') || query.get('error');
    if (error) {
      document.querySelector('h1').textContent = 'Confirmation link unavailable';
      document.querySelector('p').textContent = 'This link may have expired or already been used. Return to the app and try logging in. If your email is still unconfirmed, request a new confirmation email.';
    } else if (params.get('type') === 'signup' && params.get('access_token')) {
      document.querySelector('h1').textContent = 'Email confirmed successfully';
      document.querySelector('p').textContent = 'Your LOS Studio account is ready. Please return to the app and log in.';
    }
    // Remove credentials from the address without storing a browser session.
    history.replaceState(null, '', location.pathname);
  </script>
</body>
</html>
