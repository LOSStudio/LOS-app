<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email confirmed - LOS Studio</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      background: #fffafc;
      color: #173653;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }
    main {
      width: min(100%, 460px);
      box-sizing: border-box;
      padding: 30px;
      border: 2px dashed #b9dff1;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 12px 34px rgba(23, 54, 83, .12);
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      color: #173653;
    }
    p {
      margin: 0;
      color: #557089;
      font-size: 1.1rem;
      line-height: 1.45;
    }
    form {margin-top:22px} label {display:block;text-align:left;margin:14px 0 6px;font-size:14px}
    input {width:100%;box-sizing:border-box;border:1px solid #b9dff1;border-radius:12px;padding:13px;font-size:16px;background:#fff;color:#173653}
    button {width:100%;padding:14px;border:1px solid #edd4e2;border-radius:12px;background:linear-gradient(110deg,#f7c5dc,#c9e7f5);color:#31566e;font-size:16px;margin-top:20px;cursor:pointer}
    button:disabled {opacity:.65}
    [hidden] {display:none!important}
  </style>
</head>
<body>
  <main>
    <h1>Email confirmation</h1>
    <p id="confirmation-description">Open the confirmation link from your email, then return to the app and log in.</p>
    <form id="reset-password-form" hidden>
      <label for="reset-new-password">New password</label>
      <input id="reset-new-password" type="password" autocomplete="new-password" minlength="6" required>
      <label for="reset-confirm-password">Confirm new password</label>
      <input id="reset-confirm-password" type="password" autocomplete="new-password" minlength="6" required>
      <button id="reset-password-submit" type="submit">Save new password</button>
      <p id="reset-password-status" role="status"></p>
    </form>
  </main>
  <script src="./supabase.js"></script>
  <script src="./confirmation.js"></script>
</body>
</html>
